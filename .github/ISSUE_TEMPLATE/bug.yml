name: Bug or bad teaching
description: Something broke, or Tacit taught something wrong or unhelpfully
labels: [bug]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: e.g. Claude Code 2.1.291
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: walkthrough / learning-setup / learning-progress
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A transcript excerpt helps a lot. Remove anything private.
    validations:
      required: true
